version: 2

before:
  hooks:
    # The Queen Console Next bundle is a build artifact and is not committed, so
    # it must exist before any Go compile or the embed carries only the fallback.
    - pnpm --dir web install --frozen-lockfile
    - pnpm --dir web build
    - go mod tidy

builds:
  - id: paseka
    main: ./cmd/paseka
    binary: paseka
    env:
      - CGO_ENABLED=0
    # GoReleaser's own default writes to `main.version`, which this repository has
    # never declared: the stamp lives in internal/version so the console API can
    # read it too, and `-X` only reaches a symbol by its full import path.
    ldflags:
      - -s -w
        - -X github.com/russ-p/paseka/internal/version.version={{.Version}}
        - -X github.com/russ-p/paseka/internal/version.commit={{.FullCommit}}
        - -X github.com/russ-p/paseka/internal/version.date={{.CommitDate}}
        - -X github.com/russ-p/paseka/internal/version.dirty={{.IsGitDirty}}
    # The commit date rather than the wall clock, so two builds of one commit
    # produce the same binary.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: russ-p
    name: paseka
