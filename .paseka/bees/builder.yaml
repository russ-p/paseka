role: builder
adapter: cursor
prompt_template: builder.md
params:
  model: builder
  yolo: true
worktree: true
# Runtime-owned mechanical gate (spec 046). The script is executed from the colony
# checkout, not from the worktree under review, so a diff cannot weaken the gate
# that judges it; the working directory stays the worktree, so the checks apply
# to the diff.
checks:
  command:
    - sh
    - $COLONY_ROOT/scripts/checks.sh
  timeout: 30m
subscribes:
  - type: SIGNAL
    kind: task.ready
    dispatch: task
  - type: VERIFICATION
    kind: verification.failed
    dispatch: direct
publishes:
  - type: MUTATION
    kind: code.proposal.isolated
