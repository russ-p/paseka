role: builder
adapter: cursor
prompt_template: builder.md
params:
  model: builder
  yolo: true
worktree: true
# Runtime-owned mechanical gate (spec 046). Inline on purpose: a script living in
# the workspace would be editable by the diff it judges.
checks:
  command:
    - sh
    - -c
    - |-
      command -v gofmt >/dev/null && command -v golangci-lint >/dev/null || { echo "checks: gofmt and golangci-lint must be installed"; exit 1; }
      unformatted=$(gofmt -l .) || { echo "checks: gofmt failed"; exit 1; }
      if [ -n "$unformatted" ]; then printf "gofmt needs formatting:\n%s\n" "$unformatted"; exit 1; fi
      golangci-lint run --timeout 10m || exit 1
      go build ./... || exit 1
      go test ./... || exit 1
  timeout: 20m
subscribes:
  - type: SIGNAL
    kind: task.ready
    dispatch: task
  - type: VERIFICATION
    kind: verification.failed
    dispatch: direct
publishes:
  - type: MUTATION
    kind: code.proposal.isolated
