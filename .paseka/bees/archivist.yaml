role: archivist
adapter: cursor
prompt_template: archivist.md
default_intent: task
params:
  model: thinker
  yolo: true
worktree: false
publishes:
  - type: INSIGHT
    kind: context.note
  - type: INSIGHT
    kind: skill.proposed
completion_contract:
  required:
    - type: INSIGHT
      kind_one_of:
        - context.note
      count: 1
  intents:
    skill:
      required:
        - type: INSIGHT
          kind_one_of:
            - skill.proposed
          count: 1
