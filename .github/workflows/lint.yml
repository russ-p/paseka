name: lint

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --timeout=5m

      # The console preview bundle is not committed, so this job is also the one
      # that proves a source-only `go build` compiles and serves next/fallback.html
      # — the state `go install` ships.
      - name: Test console routes without a frontend build
        run: go test ./internal/console/...

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web check
      - run: pnpm --dir web test
      - run: pnpm --dir web build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The bundle the previous step produced is what a release build embeds;
      # compiling Go here is the check that the two halves still meet.
      - name: Build binary with the preview bundle
        run: go build -o "$RUNNER_TEMP/paseka" ./cmd/paseka

      - name: Test console routes with the preview bundle
        run: go test ./internal/console/...
